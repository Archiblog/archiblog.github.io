<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tile 16</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:#000; }
body { overflow:hidden; font-family:Arial, Helvetica, sans-serif; }
.fantasia-header { height:36px; box-sizing:border-box; padding:8px 16px; background:#000; }
.fantasia-header a { color:#fff; text-decoration:none; font-size:14px; }
.fantasia-header a:hover { text-decoration:underline; }
#mirador { position:absolute; top:36px; left:0; right:0; bottom:0; }
</style>
<script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>
<body>
<div class="fantasia-header"><a href="index.html">← Fantasia</a></div>
<div id="mirador"></div>
<script>
Mirador.viewer({
  id: 'mirador',
  windows: [{
    manifestId: 'https://archiblog.github.io/manifest/16.json',
    sideBarOpen: true,
    allowClose: false
  }],
  workspace: { type: 'mosaic' }
});
function setTileInterface() {
  document.querySelectorAll('.mirador-window-top-bar h2').forEach(function(title) {
    if (title.textContent.trim() !== 'Tile 16') title.textContent = 'Tile 16';
  });
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const textNodes=[];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(function(node) {
    if (node.nodeValue.includes('RESOURCE')) node.nodeValue=node.nodeValue.replace('RESOURCE','CONTENTS');
    if (node.nodeValue.trim()==='About this resource') node.nodeValue='About this content';
  });
}
new MutationObserver(setTileInterface).observe(document.body,{childList:true,subtree:true});
setTileInterface();
</script>
</body>
</html>
