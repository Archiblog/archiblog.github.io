<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer 02 — Systems Revisited (1969–1976)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }
  body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }
  #tile02-navigation {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 42px;
    box-sizing: border-box;
    padding: 0 18px;
    background: #000;
    z-index: 10000;
    display: flex;
    align-items: center;
  }
  #tile02-navigation nav {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  #tile02-navigation .left { justify-self: start; }
  #tile02-navigation .centre { justify-self: center; }
  #tile02-navigation .right { justify-self: end; }
  #tile02-navigation a {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    line-height: 1;
    white-space: nowrap;
  }
  #tile02-navigation a:hover { text-decoration: underline; }
  #mirador {
    position: fixed !important;
    top: 42px !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: auto !important;
    height: auto !important;
    z-index: 1;
  }
  @media (max-width: 560px) {
    #tile02-navigation { padding: 0 10px; }
    #tile02-navigation a { font-size: 12px; }
  }
</style>
<script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>
<body>
<header id="tile02-navigation" aria-label="Viewer navigation">
  <nav>
    <div class="left">
      <a href="index.html">← Fantasia</a>
    </div>
    <div class="centre">
      <a href="#" aria-label="Systems Revisited documentary exhibition">Systems Revisited (1969–1976)</a>
    </div>
    <div class="right">
      <span style="color:#aaa;font-size:12px;white-space:nowrap;">19 Canvases</span>
    </div>
  </nav>
</header>
<main id="mirador" aria-label="Systems Revisited Mirador viewer"></main>
<script>
  Mirador.viewer({
    id: 'mirador',
    windows: [{
      manifestId: 'https://archiblog.github.io/manifest/02.json',
      sideBarOpen: true,
      allowClose: false,
      panels: {
        info: true,
        attribution: true,
        canvas: true,
        annotations: true
      }
    }],
    workspace: {
      type: 'mosaic'
    }
  });
</script>
</body>
</html>
