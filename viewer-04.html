<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTb — The October 1966 Cover</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Navigation follows the existing Fantasia Mirador viewer pattern. */
  #tile04-navigation {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 42px;
    box-sizing: border-box;
    padding: 0 18px;
    background: #000;
    z-index: 10000;
    display: flex;
    align-items: center;
  }

  #tile04-navigation nav {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }

  #tile04-navigation .left { justify-self: start; }
  #tile04-navigation .centre { justify-self: center; }
  #tile04-navigation .right { justify-self: end; }

  #tile04-navigation a {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    line-height: 1;
    white-space: nowrap;
  }

  #tile04-navigation a:hover {
    text-decoration: underline;
  }

  #mirador {
    position: fixed !important;
    top: 42px !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: auto !important;
    height: auto !important;
    z-index: 1;
  }

  /* Keep the five-canvas sequence as the focus of the viewer. */
  .mirador-canvas-label {
    display: none !important;
  }

  @media (max-width: 560px) {
    #tile04-navigation {
      padding: 0 10px;
    }
    #tile04-navigation a {
      font-size: 12px;
    }
  }
</style>

<script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>

<body>

<header id="tile04-navigation" aria-label="PTb cover study navigation">
  <nav>
    <div class="left">
      <a href="index.html">← Fantasia</a>
    </div>

    <div class="centre">
      <a href="#" aria-label="Potteries Thinkbelt cover study">PTb — Cover study</a>
    </div>

    <div class="right">
      <a href="viewer-04-context.html" aria-label="Continue to the wider Potteries Thinkbelt account">Wider account →</a>
    </div>
  </nav>
</header>

<main id="mirador" aria-label="Potteries Thinkbelt five-canvas documentary viewer"></main>

<script>
  Mirador.viewer({
    id: 'mirador',

    windows: [{
      manifestId: 'https://archiblog.github.io/manifest/04.json',
      sideBarOpen: true,
      allowClose: false,
      panels: {
        info: true,
        attribution: true,
        canvas: true,
        annotations: true
      }
    }],

    workspace: {
      type: 'mosaic'
    }
  });
</script>

</body>
</html>
