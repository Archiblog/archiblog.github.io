<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tile 05</title>

  <style>
    html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

body {
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

.fantasia-header {
  height: 36px;
  box-sizing: border-box;
  padding: 8px 16px;
  background: #000;
}

.fantasia-header a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
}

.fantasia-header a:hover {
  text-decoration: underline;
}

#mirador {
  width: 100%;
  height: calc(100vh - 36px);
}

  .back-to-index {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 10000;

  color: #fff;
  text-decoration: none;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 14px;

  background: rgba(0, 0, 0, 0.7);
  padding: 6px 10px;
  border-radius: 4px;
}

.back-to-index:hover {
  background: rgba(255, 255, 255, 0.15);
}
    
  </style>

  <script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>

<body>

  <div class="fantasia-header">
    <a href="index.html">← Fantasia</a>
  </div>

  <div id="mirador"></div>

  <script>
    Mirador.viewer({
      id: 'mirador',

      windows: [
        {
          manifestId: 'https://archiblog.github.io/manifest/05.json',
          sideBarOpen: true,
          allowClose: false
        }
      ],

      workspace: {
        type: 'mosaic'
      }
    });

    /*
     * Change only the Mirador window title.
     * The Manifest itself retains the object's title.
     */

    function setTileInterface() {

  /* Archikit viewer number */
  const titles = document.querySelectorAll(
    '.mirador-window-top-bar h2'
  );

  titles.forEach(function(title) {
    if (title.textContent.trim() !== 'Tile 05') {
      title.textContent = 'Tile 05';
    }
  });


  /* Replace Mirador terminology */
  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  const textNodes = [];

  while (walker.nextNode()) {
    textNodes.push(walker.currentNode);
  }

  textNodes.forEach(function(node) {

    if (node.nodeValue.includes('RESOURCE')) {
  node.nodeValue = node.nodeValue.replace(
    'RESOURCE',
    'CONTENTS'
  );
}

    if (node.nodeValue.trim() === 'About this resource') {
      node.nodeValue = node.nodeValue.replace(
        'About this resource',
        'About this content'
      );
    }

  });
}


/* Watch Mirador as it builds and redraws its interface */
const observer = new MutationObserver(function() {
  setTileInterface();
});

observer.observe(document.body, {
  childList: true,
  subtree: true
});

setTileInterface();
  </script>

</body>
</html>
