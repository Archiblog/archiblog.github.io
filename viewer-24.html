<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Archikit 01</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #mirador {
      width: 100%;
      height: 100vh;
    }
  </style>

  <script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>

<body>

  <div id="mirador"></div>

  <script>
    Mirador.viewer({
      id: 'mirador',

      windows: [
        {
          manifestId: 'https://archiblog.github.io/manifest/manifest.json',
          sideBarOpen: true,
          allowClose: false
        }
      ],

      workspace: {
        type: 'mosaic'
      }
    });

    /*
     * Change only the Mirador window title.
     * The Manifest itself retains the object's title.
     */

    function setArchikitInterface() {

  /* Archikit viewer number */
  const titles = document.querySelectorAll(
    '.mirador-window-top-bar h2'
  );

  titles.forEach(function(title) {
    if (title.textContent.trim() !== 'Archikit 01') {
      title.textContent = 'Archikit 01';
    }
  });


  /* Replace Mirador terminology */
  const walker = document.createTreeWalker(
    document.body,
    NodeFilter.SHOW_TEXT
  );

  const textNodes = [];

  while (walker.nextNode()) {
    textNodes.push(walker.currentNode);
  }

  textNodes.forEach(function(node) {

    if (node.nodeValue.trim() === 'RESOURCE') {
      node.nodeValue = node.nodeValue.replace(
        'RESOURCE',
        'CONTENTS'
      );
    }

    if (node.nodeValue.trim() === 'About this resource') {
      node.nodeValue = node.nodeValue.replace(
        'About this resource',
        'About this content'
      );
    }

  });
}


/* Watch Mirador as it builds and redraws its interface */
const observer = new MutationObserver(function() {
  setArchikitInterface();
});

observer.observe(document.body, {
  childList: true,
  subtree: true
});

setArchikitInterface();
  </script>

</body>
</html>
