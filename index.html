<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasia</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      width: calc(100% - 40px);
      max-width: 1400px;
      margin: 40px auto;
    }

    h1 {
      margin: 0 0 30px 0;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    .fantasia {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .tile {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 18px;
      background: #222;
    }

    .tile a {
      display: block;
      width: 100%;
      height: 100%;
    }

    .tile img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
    }

    .placeholder {
      width: 100%;
      height: 100%;
      background: #222;
    }

    @media (max-width: 800px) {
      .fantasia {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .fantasia {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <h1>FANTASIA</h1>

    <section class="fantasia">

      <div class="tile">
       <a href="viewer-01.html" aria-label="Open Archikit Viewer 01">
          <img
            src="images/item_13831.jpg"
            alt="Norman Fellows seated beside a photograph of Cedric Price"
          >
        </a>
      </div>

      <div class="tile">
        <div class="placeholder"></div>
      </div>

      <div class="tile">
        <div class="placeholder"></div>
      </div>

      <div class="tile">
        <div class="placeholder"></div>
      </div>

    </section>

  </main>

</body>
</html>
