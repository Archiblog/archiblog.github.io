<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fantasia</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .fantasia {
      box-sizing: border-box;
      width: 100%;
      padding: 42px 5.5vw 60px 5.5vw;

      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 18px;
    }

    .tile {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;

  background: #222;
  border: 1px solid rgba(255, 255, 255, 0.9);
  border-radius: 16px;
  overflow: hidden;

  text-decoration: none;
  color: #fff;
}

    .tile img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 16px;
}

.tile-04 img {
  transform: scale(1.08);
}

      transition: opacity 0.25s ease;
    }

    .tile:hover img {
      opacity: 0.82;
    }

    .number {
      position: absolute;
      left: 12px;
      bottom: 10px;

      font-size: 12px;
      line-height: 1;
      font-weight: 400;

      color: rgba(255, 255, 255, 0.72);

      pointer-events: none;
    }

    /* Empty tiles retain the Fantasia field */
    .empty {
      background: #222;
    }

    @media (max-width: 900px) {
      .fantasia {
        grid-template-columns: repeat(2, 1fr);
        padding-left: 4vw;
        padding-right: 4vw;
      }
    }

    @media (max-width: 520px) {
      .fantasia {
        grid-template-columns: 1fr;
        padding-left: 5vw;
        padding-right: 5vw;
      }

      .tile {
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
