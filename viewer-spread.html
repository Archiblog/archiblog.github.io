<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spread</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Spread navigation — deliberately independent of Mirador */
  #spread-navigation {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 42px;
    box-sizing: border-box;
    padding: 0 18px;
    background: #000;
    z-index: 10000;
    display: flex;
    align-items: center;
  }

  #spread-navigation nav {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }

  #spread-navigation .left {
    justify-self: start;
  }

  #spread-navigation .centre {
    justify-self: center;
  }

  #spread-navigation .right {
    justify-self: end;
  }

  #spread-navigation a {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    line-height: 1;
    white-space: nowrap;
  }

  #spread-navigation a:hover {
    text-decoration: underline;
  }

  /* Mirador occupies everything below the navigation */
  #mirador {
    position: fixed !important;
    top: 42px !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: auto !important;
    height: auto !important;
    z-index: 1;
  }

  /* Spread experiment: hide the redundant Canvas label */
  .mirador-canvas-label {
    display: none !important;
  }
  
</style>

<script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>

</head>

<body>

<header id="spread-navigation" aria-label="Spread navigation">

  <nav>

    <div class="left">
      <a href="index.html">← Fantasia</a>
    </div>

    <div class="centre">
      <a href="#" aria-label="Spread">
        Spread
      </a>
    </div>

    <div class="right">
      <a href="#" aria-label="Catalogue placeholder">
        Catalogue →
      </a>
    </div>

  </nav>

</header>

<main id="mirador" aria-label="Spread Viewer"></main>

<script>
  Mirador.viewer({
    id: 'mirador',

    windows: [{
      manifestId: 'https://archiblog.github.io/manifest/spread.json',
      sideBarOpen: true,
      allowClose: false,
      panels: {
        info: true,
        attribution: true,
        canvas: true,
        annotations: true
      }
    }],

    workspace: {
      type: 'mosaic'
    }
  });
  
</script>
</body>
</html>
