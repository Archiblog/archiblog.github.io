<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Archikit 01</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #mirador {
      width: 100%;
      height: 100vh;
    }
  </style>

  <script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>

<body>

  <div id="mirador"></div>

  <script>
    Mirador.viewer({
      id: 'mirador',

      windows: [
        {
          manifestId: 'https://archiblog.github.io/manifest/manifest.json',
          sideBarOpen: true,
          allowClose: false
        }
      ],

      workspace: {
        type: 'mosaic'
      }
    });

    /*
     * Archikit viewer numbering
     *
     * Mirador normally uses the Manifest label as the
     * window title. We retain the proper object title
     * in the Manifest, but replace the window title with
     * the Archikit position.
     */

    function setArchikitTitle() {
      const titles = document.querySelectorAll(
        '.mirador-window-top-bar h2'
      );

      titles.forEach(function(title) {
        title.textContent = 'Archikit 01';
      });
    }

    const observer = new MutationObserver(function() {
      setArchikitTitle();
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    setArchikitTitle();
  </script>

</body>
</html>
