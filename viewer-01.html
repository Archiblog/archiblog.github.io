<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tile 01</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  body {
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
  }

  /* Tile navigation — deliberately independent of Mirador */
  #tile01-navigation {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 42px;
    box-sizing: border-box;
    padding: 0 18px;
    background: #000;
    z-index: 10000;
    display: flex;
    align-items: center;
  }

  #tile01-navigation nav {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
  }

  #tile01-navigation .left {
    justify-self: start;
  }

  #tile01-navigation .centre {
    justify-self: center;
  }

  #tile01-navigation .right {
    justify-self: end;
  }

  #tile01-navigation a {
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    line-height: 1;
    white-space: nowrap;
  }

  #tile01-navigation a:hover {
    text-decoration: underline;
  }

  /* Single image viewer */
  #medikit-viewer {
    position: fixed;
    top: 42px;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #medikit-viewer img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
</style>

</head>

<body>

<header id="tile01-navigation" aria-label="Tile navigation">
  <nav>

    <div class="left">
      <a href="index.html">← Fantasia</a>
    </div>

    <div class="centre">
      <a href="viewer-spread.html" aria-label="viewer-spread.html">
        Spread ↑
      </a>
    </div>

    <div class="right">
      <a href="" aria-label="Catalogue placeholder">
        Catalogue →
      </a>
    </div>

  </nav>
</header>

<main id="medikit-viewer" aria-label="Tile 01 Viewer">

  <img
    src="images/item_27314.png"
    alt="Medikit">

</main>

</body>
</html>
