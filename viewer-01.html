```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Archikit — Viewer 01</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #mirador {
      width: 100%;
      height: 100vh;
    }
  </style>

  <script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>

<body>

  <div id="mirador"></div>

  <script>
    Mirador.viewer({
      id: 'mirador',

      windows: [
        {
          manifestId: 'manifest/manifest.json',
          sideBarOpen: true,
          allowClose: false
        }
      ],

      workspace: {
        type: 'mosaic'
      }
    });
  </script>

</body>
</html>
```
