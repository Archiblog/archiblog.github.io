<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collage</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
}

body {
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

/* Collage navigation — deliberately independent of Mirador */
#collage-navigation {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 42px;
  box-sizing: border-box;
  padding: 0 18px;
  background: #000;
  z-index: 10000;
  display: flex;
  align-items: center;
}

#collage-navigation nav {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
}

#collage-navigation .left {
  justify-self: start;
}

#collage-navigation .centre {
  justify-self: center;
}

#collage-navigation .right {
  justify-self: end;
}

#collage-navigation a {
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  line-height: 1;
  white-space: nowrap;
}

#collage-navigation a:hover {
  text-decoration: underline;
}

/* Mirador occupies everything below the navigation */
#mirador {
  position: fixed !important;
  top: 42px !important;
  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: auto !important;
  height: auto !important;
  z-index: 1;
}

/* Hide the redundant Canvas label */
.mirador-canvas-label {
  display: none !important;
}
</style>

<script src="https://unpkg.com/mirador@4.1.0/dist/mirador.min.js"></script>
</head>

<body>

<header id="collage-navigation" aria-label="Collage navigation">
  <nav>
    <div class="left">
      <a href="viewer-spread.html">← Spread</a>
    </div>

    <div class="centre">
      <a href="#" aria-label="Collage">Collage</a>
    </div>

    <div class="right">
      <a href="#" aria-label="Catalogue placeholder">Catalogue →</a>
    </div>
  </nav>
</header>

<main id="mirador" aria-label="Collage Viewer"></main>

<script>
Mirador.viewer({
  id: 'mirador',

  windows: [{
    manifestId: 'https://archiblog.github.io/manifest/collage.json',
    sideBarOpen: true,
    allowClose: false,

    panels: {
      info: true,
      attribution: true,
      canvas: true,
      annotations: true
    }
  }],

  workspace: {
    type: 'mosaic'
  }
});
</script>

</body>
</html>
